name: Desktop release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            arch: x64
            executable: release/win-unpacked/AgentSwitcher.exe
          - os: windows-11-arm
            platform: win
            arch: arm64
            executable: release/win-arm64-unpacked/AgentSwitcher.exe
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/AgentSwitcher.app/Contents/MacOS/AgentSwitcher
          - os: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/AgentSwitcher.app/Contents/MacOS/AgentSwitcher
    runs-on: ${{ matrix.os }}
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check out release verification tools
        uses: actions/checkout@v4
        with:
          # Keep the application pinned to its tag while allowing CI-only fixes
          # to verify an existing release with the workflow's exact revision.
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/smoke-electron.mjs
            scripts/smoke-update-mac.mjs
            scripts/smoke-update-network.mjs
            tests/update-installer.test.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag and native architecture
        run: >-
          node -e "const p=require('./package.json');
          if(!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=='v'+p.version)throw new Error('Tag must match package.json version');
          if(process.arch!==process.env.TARGET_ARCH)throw new Error('Native runner architecture mismatch');"
      - run: pnpm install --frozen-lockfile
      - name: Use current installer verification tests
        # Verification fixes may follow an immutable application tag. Only the
        # tests are copied; the application being built stays pinned above.
        run: node -e "require('node:fs').copyFileSync('.release-tools/tests/update-installer.test.ts', 'tests/update-installer.test.ts')"
      - run: pnpm test
      - if: runner.os == 'Windows'
        run: pnpm test:force-stop
      - run: pnpm build
      - name: Test update system proxy and redirects
        run: node .release-tools/scripts/smoke-update-network.mjs
      - name: Test native Electron
        if: runner.os == 'Windows'
        # macOS runs the packaged binary below so a second app identity cannot
        # prompt for access to the same Safe Storage Keychain item.
        run: node .release-tools/scripts/smoke-electron.mjs
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Package macOS disk image and archive
        if: runner.os == 'macOS'
        # Ad-hoc signing allows Apple Silicon to run the build without a Developer ID.
        # These community builds are not notarized; signing secrets are not required.
        run: pnpm exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.notarize=false
      - name: Prepare isolated macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/agent-switcher-smoke.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          # Updated fixture bundles have a different ad-hoc identity. Permit
          # them to share this disposable test password without a GUI prompt.
          fixture_password="$(openssl rand -base64 24)"
          echo "::add-mask::$fixture_password"
          security add-generic-password -a 'AgentSwitcher Key' -s 'AgentSwitcher Safe Storage' -w "$fixture_password" -A "$keychain"
          echo "AGENT_SWITCHER_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "AGENT_SWITCHER_TEST_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          # LaunchServices restarts the fixture in the GUI audit session;
          # keychain unlock state is separate from the runner's CLI session.
          runner_uid="$(id -u)"
          runner_user="$(id -un)"
          sudo -n /bin/launchctl asuser "$runner_uid" /usr/bin/sudo -n -u "$runner_user" /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
      - name: Test packaged application
        timeout-minutes: 5
        run: node .release-tools/scripts/smoke-electron.mjs
        env:
          AGENT_SWITCHER_EXECUTABLE: ${{ matrix.executable }}
      - name: Test macOS application replacement and restart
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node .release-tools/scripts/smoke-update-mac.mjs
        env:
          AGENT_SWITCHER_EXECUTABLE: ${{ matrix.executable }}
      - name: Remove isolated macOS test keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/agent-switcher-smoke.keychain-db" || true
      - name: Collect validated installers
        run: >-
          node -e "const fs=require('node:fs');const v=require('./package.json').version;
          const prefix='AgentSwitcher-'+v+'-'+process.env.TARGET_PLATFORM+'-'+process.env.TARGET_ARCH;
          fs.mkdirSync('release-assets',{recursive:true});
          for(const ext of process.env.TARGET_PLATFORM==='win'?['.exe']:['.dmg','.zip']){
          const name=prefix+ext;const src='release/'+name;
          if(!fs.statSync(src).isFile()||fs.statSync(src).size<1024)throw new Error('Missing or empty installer: '+name);
          fs.copyFileSync(src,'release-assets/'+name);}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete release and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          cd release-assets
          expected=(
            "AgentSwitcher-${version}-win-x64.exe"
            "AgentSwitcher-${version}-win-arm64.exe"
            "AgentSwitcher-${version}-mac-x64.dmg"
            "AgentSwitcher-${version}-mac-x64.zip"
            "AgentSwitcher-${version}-mac-arm64.dmg"
            "AgentSwitcher-${version}-mac-arm64.zip"
          )
          for file in "${expected[@]}"; do test -s "$file"; done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create draft, upload all assets, and publish
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Windows 和 macOS 安装包 / Windows and macOS installers.

          修复“浏览器能下载，应用内更新却连接失败”：更新检查和下载现在跟随系统代理，兼容系统 PAC 配置，并保留 GitHub 下载重定向检查、流式下载与 SHA-256 校验。0.2.4 / 0.2.5 如无法下载更新，请先通过浏览器下载本版安装包并手动安装一次。

          Fixes update downloads failing while browser downloads work. Update requests now use the system proxy and PAC settings while retaining redirect validation, streaming, and SHA-256 verification. If v0.2.4 or v0.2.5 cannot download updates, install this release once using your browser.

          - Windows x64: Intel / AMD PC；Windows arm64: ARM PC。
          - macOS x64: Intel Mac；macOS arm64: Apple Silicon (M1 及更新)。
          - macOS 使用 DMG 安装，也提供 ZIP；SHA256SUMS.txt 可校验下载文件。

          修复第三方配置的模型与推理强度记忆：DeepSeek、GLM、Kimi 等配置分别保留在 Codex 中最后选择的参数，切回 GPT 订阅再返回或重启 AgentSwitcher 后仍能恢复。切换失败会回滚配置与记忆。

          Fixes model and reasoning-effort preferences for third-party profiles. Each profile remembers its last Codex selection across ChatGPT round trips and AgentSwitcher restarts. Failed switches roll back both the configuration and saved preferences.

          新增应用内更新：在“通用设置 → 应用更新”检查本仓库的最新正式版，下载对应系统和架构的安装包，校验 SHA-256 后安装并重启。更新保留已保存的配置与密钥；安装前请先保存草稿，API 连接会在重启时短暂中断。macOS 使用退出后替换与旧版备份，Windows 使用原位升级安装程序。

          Adds in-app updates in General settings: check this repository for the latest stable release, download the matching platform and architecture, verify SHA-256, then install and restart. Saved configurations and keys are preserved. Save unsaved changes first; API connections pause during restart. macOS replaces the app after exit with a backup; Windows runs the in-place upgrade installer.

          当前社区构建没有 Windows 代码签名或 Apple Developer ID / 公证。macOS 包采用 ad-hoc 签名。系统可能要求通过“系统设置 → 隐私与安全性 → 仍要打开”确认后运行。

          These community builds do not have Windows code signing or Apple Developer ID notarization. macOS builds use ad-hoc signatures. Approve the app in System Settings → Privacy & Security if required.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            if [[ "$(cat release-draft.txt)" != true ]]; then
              echo 'This tag already has a published release; refusing to overwrite it.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AgentSwitcher $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          test "$count" -eq 7
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json url --jq .url
